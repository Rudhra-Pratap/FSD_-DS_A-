<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator</title>
</head>
<body>
    <script>
        let a=12;
        let b=11;
        let c=a+b;
        alert("Value is = "+c);
        let d=a-b;
        alert("Value is = "+d);
        let e=a*b
        alert("Value is = "+e);
        let f=a/b;
        alert("Value is = "+f);
    </script>
</body>
</html>
