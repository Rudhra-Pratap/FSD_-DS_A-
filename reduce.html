<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reduce Function</title>
</head>
<body>
    <script>
        const num=[10,20,30,40,50,45,35,25,15];
        const even=num.filter((i)=>(i%2==0));
        const square=even.map((i)=>(i*i));
        const sum=square.reduce((i,s)=>i+s)
        console.log(square);
        console.log(sum);
    </script>
</body>
</html>
